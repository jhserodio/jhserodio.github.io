name: Site (Astro + GitHub Pages)
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Unit tests
        run: npm test
      - name: Check CVRP browser scripts
        run: |
          node --check public/cvrp-simulator.js
          node --check public/cvrp-worker.js
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Assert WASM module and CVRP pages were built
        run: |
          test -s dist/wasm/cvrp-solver/cvrp_solver_wasm_bg.wasm
          test -s dist/wasm/cvrp-solver/cvrp_solver_wasm.js
          test -s dist/en/apps/cvrp-solver/index.html
          test -s dist/pt/apps/cvrp-solver/index.html
      - name: Smoke-test compiled Rust/WASM solver
        run: node scripts/check-cvrp-wasm.mjs
      - name: Verify generated Open Graph previews
        run: node scripts/check-social-preview.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
