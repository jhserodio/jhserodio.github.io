name: Probe Medium author-owned article media
on:
  push:
    branches: [update-resume]
    paths:
      - "scripts/probe-article-images.mjs"
      - ".github/workflows/probe-article-images.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-article-images.mjs
