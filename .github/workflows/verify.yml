name: Verify Astro site

on:
  push:
    branches: [update-resume]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    # Chromium dependencies are tested on the Playwright-supported 24.04 image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Unit tests
        run: npm test
      - name: Check CVRP browser scripts
        run: |
          node --check public/cvrp-simulator.js
          node --check public/cvrp-worker.js
      - name: Typecheck and Astro diagnostics
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Verify critical static routes
        run: |
          for route in \
            dist/pt/index.html dist/en/index.html \
            dist/pt/resume/index.html dist/en/resume/index.html \
            dist/pt/cover-letter/index.html dist/en/cover-letter/index.html \
            dist/pt/articles/index.html dist/en/articles/index.html \
            dist/pt/articles/matematica-com-rust-modulo-1/index.html dist/en/articles/math-with-rust-module-1/index.html \
            dist/pt/apps/index.html dist/en/apps/index.html \
            dist/pt/apps/cvrp-solver/index.html dist/en/apps/cvrp-solver/index.html \
            dist/pt/rss.xml dist/en/rss.xml; do
            test -f "$route" || { echo "Missing static route: $route"; exit 1; }
          done

      - name: Verify WASM files
        run: |
          test -s dist/wasm/cvrp-solver/cvrp_solver_wasm_bg.wasm
          test -s dist/wasm/cvrp-solver/cvrp_solver_wasm.js
      - name: Smoke-test compiled Rust/WASM solver
        run: node scripts/check-cvrp-wasm.mjs
      - name: Browser interaction and cross-order tests (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.config.mjs
