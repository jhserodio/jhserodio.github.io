[package]
name = "cvrp-solver-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
logistic_problem_with_max_capacity = { git = "https://github.com/jhserodio/logistic_problem_with_max_capacity.git", rev = "04b844906639aef6d90100a617f631e49f578982" }

# wasm-opt bundled with wasm-pack cannot parse recent Rust multi-table WASM.
# Skip this optional pass; rustc release optimizations remain enabled.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
