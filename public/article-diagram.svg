<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Quadratic optimization in two dimensions</title>
<desc id="desc">Contour lines around the minimum of a convex quadratic surface, with an iterative path approaching the optimum.</desc>
<rect width="960" height="480" fill="#151b1e"/>
<g stroke="#839087" fill="none" opacity=".6" stroke-width="2">
<ellipse cx="580" cy="233" rx="340" ry="197"/><ellipse cx="580" cy="233" rx="280" ry="162"/>
<ellipse cx="580" cy="233" rx="220" ry="125"/><ellipse cx="580" cy="233" rx="155" ry="91"/>
<ellipse cx="580" cy="233" rx="88" ry="52"/>
</g>
<g stroke="#9ca3af" stroke-width="2" opacity=".5">
<line x1="95" y1="410" x2="895" y2="410"/><line x1="95" y1="410" x2="95" y2="65"/>
</g>
<path d="M185 365 L315 165 L420 310 L500 215 L552 250 L580 233" stroke="#e8bc64" stroke-width="5" fill="none" stroke-linejoin="round"/>
<g fill="#e8bc64" stroke="#151b1e" stroke-width="2"><circle cx="185" cy="365" r="9"/><circle cx="315" cy="165" r="8"/><circle cx="420" cy="310" r="7"/><circle cx="500" cy="215" r="6"/><circle cx="552" cy="250" r="6"/><circle cx="580" cy="233" r="7"/></g>
<g fill="#f3eee0" font-size="23" font-family="monospace"><text x="111" y="59">f(x) = 1/2 (x - x*)^T A (x - x*)</text><text x="597" y="216">x*</text><text x="870" y="441">x₁</text><text x="64" y="67">x₂</text></g>
</svg>